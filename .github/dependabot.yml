version: 2
updates:
  # The package itself has no runtime dependencies, so the surface here is the
  # CI actions and the dev tooling pins.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
